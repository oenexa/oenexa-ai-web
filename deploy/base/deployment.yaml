apiVersion: apps/v1
kind: Deployment
metadata:
  name: oenexa-ai-web
  labels:
    app.kubernetes.io/name: oenexa-ai-web
    app.kubernetes.io/part-of: oenexa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oenexa-ai-web
  template:
    metadata:
      labels:
        app: oenexa-ai-web
    spec:
      containers:
        - name: oenexa-ai-web
          image: oenexa/
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
name: OENEXA AI Web CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Verify & Test OENEXA AI Web
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout Code Repository (github.com/oenexa/oenexa-ai-web)
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Vitest Verification Tests
        run: npm test

      - name: Build Vite Production Assets (dist/)
        run: npm run build

  build-and-push:
    needs: build-and-test
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OENEXA AI Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy OENEXA AI Web directly on VPS
        run: |
          set -e
          echo "Deploying OENEXA AI Web on VPS (62.210.92.60)..."
          if [ -d "/opt/oenexa/src/oenexa-ai-web/.git" ]; then
            cd /opt/oenexa/src/oenexa-ai-web
            git fetch origin main
            git reset --hard origin/main
          fi
          cd /opt/oenexa
          docker compose -f docker-compose.prod.yml build oenexa-ai-web
          docker compose -f docker-compose.prod.yml up -d --no-deps oenexa-ai-web
          docker compose -f docker-compose.prod.yml ps oenexa-ai-web

name: OENEXA AI Web CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Verify & Test OENEXA AI Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository (github.com/oenexa/oenexa-ai-web)
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest In-Process Real Verification Tests
        run: npm test

      - name: Build Vite Production Assets (dist/)
        run: npm run build

      - name: Build Container Image (oenexa/ai-web:latest)
        run: docker build -t oenexa/ai-web:latest -f Dockerfile .

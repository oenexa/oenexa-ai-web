name: OENEXA AI Web CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Verify & Test OENEXA AI Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository (github.com/oenexa/oenexa-ai-web)
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Vitest Verification Tests
        run: npm test

      - name: Build Vite Production Assets (dist/)
        run: npm run build

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OENEXA AI Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.VPS_SSH_KEY }}
        if: env.SSH_KEY != ''
        with:
          host: ${{ secrets.SERVER_HOST || '62.210.92.60' }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            echo "Deploying OENEXA AI Web on VPS (62.210.92.60)..."
            if [ -d "/opt/oenexa/src/oenexa-ai-web/.git" ]; then
              cd /opt/oenexa/src/oenexa-ai-web
              git fetch origin main
              git reset --hard origin/main
            fi
            cd /opt/oenexa
            docker compose -f docker-compose.prod.yml build oenexa-ai-web
            docker compose -f docker-compose.prod.yml up -d --no-deps oenexa-ai-web
            docker compose -f docker-compose.prod.yml ps oenexa-ai-web

      - name: Report missing SSH secret
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.VPS_SSH_KEY }}
        if: env.SSH_KEY == ''
        run: echo "::warning::SERVER_SSH_KEY / VPS_SSH_KEY secret is not configured in this repository. Skipping automatic SSH deployment to VPS."

groups:
  - name: oenexa-ai-web-alerts
    rules:
      - alert: ServiceDown
        expr: up{service=\"oenexa-ai-web\"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: \"oenexa-ai-web instance is down\"
          description: \"Pod for oenexa-ai-web has been down for more than 1 minute.\"
      - alert: High5xxRate
        expr: rate(http_requests_total{service=\"oenexa-ai-web\",status=~\"5..\"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: \"Elevated 5xx error rate on oenexa-ai-web\"